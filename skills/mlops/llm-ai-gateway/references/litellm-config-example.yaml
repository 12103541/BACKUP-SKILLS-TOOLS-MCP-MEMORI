# Key findings from session:
# 1. OpenRouter model IDs must use full path: openrouter/deepseek/deepseek-chat (not deepseek-chat)
# 2. API key MUST be in config.yaml litellm_params.api_key — header Authorization ignored
# 3. SQLite NOT supported for virtual keys — requires PostgreSQL
# 4. Master key required for requests when no DB connected
# 5. Windows config path: use forward slashes C:/Users/xxx/config.yaml
# 6. Fallback works via router_settings.fallback_models (needs router init)
# 7. Cost tracking via model_info input/output cost per token